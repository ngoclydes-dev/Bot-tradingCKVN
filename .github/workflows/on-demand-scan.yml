name: On-demand scan (lenh scan tu Telegram)

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Ma co phieu can phan tich (VD: VNM, FPT, HPG)'
        required: true
        type: string

jobs:
  scan-symbol:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cai dat thu vien
        run: pip install -r requirements.txt

      - name: Kiem tra moi truong truoc khi chay
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - << 'PYEOF'
          import os, sys

          print("=== KIEM TRA SECRETS ===")
          secrets = ["TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID", "GEMINI_API_KEY", "ANTHROPIC_API_KEY"]
          for s in secrets:
              val = os.getenv(s, "")
              print(f"{s}: {'CO (' + str(len(val)) + ' ky tu)' if val else 'KHONG CO'}")

          print("\n=== KIEM TRA THU VIEN ===")
          libs = ["yfinance", "pandas", "numpy", "requests", "feedparser", "anthropic"]
          for lib in libs:
              try:
                  __import__(lib)
                  print(f"{lib}: OK")
              except ImportError as e:
                  print(f"{lib}: LOI - {e}")

          print("\n=== KIEM TRA IMPORT MODULES BOT ===")
          sys.path.insert(0, '.')
          modules = ["config", "data_fetcher", "indicators", "news_fetcher",
                     "ai_analyzer", "entry_strategy", "deep_analysis",
                     "multi_ai", "market_summary_ai", "main"]
          for mod in modules:
              try:
                  __import__(mod)
                  print(f"{mod}: OK")
              except Exception as e:
                  print(f"{mod}: LOI - {e}")
          PYEOF

      - name: Phan tich ma va gui Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py --scan "${{ github.event.inputs.symbol }}" --telegram
