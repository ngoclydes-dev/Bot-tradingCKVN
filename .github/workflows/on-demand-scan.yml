name: On-demand scan (lenh scan tu Telegram)

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Ma co phieu can phan tich (VD: VNM, FPT, HPG)'
        required: true
        type: string

jobs:
  scan-symbol:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cai dat thu vien
        run: pip install -r requirements.txt

      - name: Test Gemini API truc tiep
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - << 'PYEOF'
          import os, sys
          key = os.getenv("GEMINI_API_KEY", "")
          print(f"GEMINI_API_KEY: {'CO KEY (' + str(len(key)) + ' ky tu)' if key else 'KHONG CO KEY'}")
          if not key:
              print("ERROR: Chua them GEMINI_API_KEY vao GitHub Secrets")
              sys.exit(0)

          try:
              from google import genai
              client = genai.Client(api_key=key)
              print("Thu model: gemini-2.0-flash...")
              response = client.models.generate_content(
                  model="gemini-2.0-flash",
                  contents="Tra loi bang 1 tu: chao",
              )
              print("Gemini OK! Ket qua:", response.text[:50])
          except Exception as e:
              print(f"Gemini LOI: {e}")
              try:
                  print("Thu model du phong: gemini-1.5-flash...")
                  response = client.models.generate_content(
                      model="gemini-1.5-flash",
                      contents="Tra loi bang 1 tu: chao",
                  )
                  print("Gemini 1.5 OK! Ket qua:", response.text[:50])
              except Exception as e2:
                  print(f"Gemini 1.5 cung LOI: {e2}")
          PYEOF

      - name: Phan tich ma va gui Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py --scan "${{ github.event.inputs.symbol }}" --telegram
